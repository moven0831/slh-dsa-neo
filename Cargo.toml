[workspace]
resolver = "2"
members = [
    "crates/slh-poseidon-gl",
    "crates/neo-bridge",
    "crates/neo-ivc",
    "crates/neo-bench",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moven0831/slh-dsa-neo"
rust-version = "1.88"

[workspace.dependencies]
# Folding library — pinned to match tools/nightstream-spike in slh-dsa-circuit.
# See research/folding/week2_prereqs.md §1 in slh-dsa-circuit.
neo-ccs              = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "755c1595f3b34b5c2bc9eaa50417cdf9dfb871ec" }
neo-math             = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "755c1595f3b34b5c2bc9eaa50417cdf9dfb871ec" }
neo-params           = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "755c1595f3b34b5c2bc9eaa50417cdf9dfb871ec" }
neo-reductions       = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "755c1595f3b34b5c2bc9eaa50417cdf9dfb871ec" }
neo-fold-prototype   = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "755c1595f3b34b5c2bc9eaa50417cdf9dfb871ec" }

# Goldilocks field; lock matches Nightstream's transitive pin (Cargo.lock cross-check).
p3-field             = { version = "=0.5.1", default-features = false }

anyhow               = "1"
thiserror            = "1"
clap                 = { version = "4", features = ["derive"] }
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
criterion            = { version = "0.5", features = ["html_reports"] }

[profile.release]
debug = true            # keep symbols for RSS / flamegraph inspection
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
